symbols:
  - name: XAUUSD
    enabled: true
    broker_symbol: XAUUSD
    aliases:
      - XAUUSD.a
      - XAUUSDm
    enabled_timeframe_sets:
      - set_1
      - set_2
      - set_3

  - name: EURUSD
    enabled: true

  - name: GBPUSD
    enabled: true

  - name: USDJPY
    enabled: true

  - name: GBPJPY
    enabled: true

  - name: US30
    enabled: false

  - name: BTCUSD
    enabled: true
    aliases:
      - BTCUSD
      - BTCUSD.a
      - BTCUSDm

  - name: NAS100
    enabled: false
    broker_symbol: USTEC
    aliases:
      - USTEC
      - USTEC.cash
      - US100
      - NAS100.cash
      - NAS100m

timeframe_sets:
  set_1:
    enabled: true
    htf: D1
    mtf: H4
    ltf: H1
    candles_to_fetch: 500

  set_2:
    enabled: true
    htf: H4
    mtf: H1
    ltf: M15
    candles_to_fetch: 500

  set_3:
    enabled: true
    htf: H1
    mtf: M15
    ltf: M5
    candles_to_fetch: 500

telegram:
  enabled: true
  high_confidence_only: true
  minimum_risk_reward: 2.0
  require_complete_trade_plan: true
  send_wait_alerts: false
  send_invalidated_alerts: false

discord:
  enabled: true
  username: MTF IFVG Bot
  high_confidence_only: true
  minimum_risk_reward: 2.0
  require_complete_trade_plan: true
  send_wait_alerts: false
  send_invalidated_alerts: false

scanner:
  scan_interval_seconds: 60
  max_alerts_per_symbol_per_hour: 3
  duplicate_cooldown_minutes: 30
  log_wait_states: true
  log_market_data_fetch: true
  track_trade_outcomes: true

filters:
  # When true, lower timeframe alerts are still sent but get an HTF conflict warning and -1 confluence.
  warn_htf_priority: true
  # HTF-only FVG size filter. 0 disables it.
  # pip_size auto: Forex=0.0001, JPY pairs=0.01, XAU/XAG=0.1, other symbols=1.0.
  min_htf_fvg_pips: 0
  pip_size: auto

strategy:
  candles_to_fetch: 200
  minimum_risk_reward: 2.0

  pivots:
    left_bars: 3
    right_bars: 3

  fvg:
    merge_enabled: true
    require_entry_fvg_opposes_sweep: true
    # bonus = add confluence point, off = ignore
    untapped_htf_fvg_mode: bonus

  trend_filter:
    enabled: true
    fast_period: 50
    slow_period: 200
    strict_requirement: false

  confluence:
    high_rr_threshold: 3.0
    major_liquidity_sweep_bonus: true
    untapped_htf_fvg_bonus: true
    htf_trend_alignment_bonus: true

  liquidity_sweep:
    enabled: true

  scenarios:
    mtf_override:
      enabled: true
      lookback_candles: 4

    base_ltf:
      enabled: true

  invalidation:
    scenario_3_enabled: false
    minimum_rr_enabled: false

  risk:
    minimum_risk_reward: 0.5
    entry_boundary: support_resistance
    require_tp1: true
    sl_mode: swing_only
    fixed_stop_pips: 100
    risk_percent_per_trade: 1.0
    # Use "auto" as a practical default, or override exact broker values under pip_values_by_symbol.
    pip_value_per_lot: auto
    pip_values_by_symbol:
      XAUUSD: 10
      EURUSD: 10
      GBPUSD: 10
      USDJPY: 10
      US30: 1
      NAS100: 1
      BTCUSD: 1
    lot_size_balances:
      - 10000
      - 50000
      - 100000

    tp2:
      enabled: true
      source: previous_day

sessions:
  timezone: America/New_York

  asian:
    enabled: true
    start: "07:00"
    end: "15:00"

  london:
    enabled: true
    start: "15:00"
    end: "23:00"

  new_york:
    enabled: true
    start: "20:00"
    end: "04:00"

data:
  mode: mt5
  csv_folder: sample_data
  daily_timeframe: D1

  mt5:
    fallback_to_csv_on_error: false
